name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
  pull_request:

jobs:
  foss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test
        run: bundle exec fastlane test_foss
      - name: Build
        run: bundle exec fastlane build_foss

  play:
    runs-on: ubuntu-latest
    # Forks have no access to the private pro submodule (PRO_DEPLOY_KEY), so skip
    # this job entirely in fork repositories, and also skip forked PRs upstream.
    if: (!github.event.repository.fork) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test
        run: bundle exec fastlane test_play
      - name: Build
        run: bundle exec fastlane build_play
